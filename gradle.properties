# Build performance: five small modules with a fan-in on core, so parallel execution and the
# build cache both pay off.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Daemon JVM heap. WHICH JVM the daemon runs on is pinned portably in
# gradle/gradle-daemon-jvm.properties (see `gradle updateDaemonJvm`), so neither JAVA_HOME
# nor an IDE's SDK setting decides it.
org.gradle.jvmargs=-Xmx2g
